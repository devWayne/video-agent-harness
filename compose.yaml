services:
  harness:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "4100:4100"
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DATA_DIR: /app/data
    volumes:
      - harness-data:/app/data

volumes:
  harness-data:
