<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img" aria-labelledby="title desc">
  <title id="title">Agent-directed Video Production Architecture</title>
  <desc id="desc">Codex GPT owns creative decisions through repository skills. TypeScript Runtime executes typed operations and stores facts. External providers generate control drafts and final shots. Production Console visualizes state only.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091113"/><stop offset="1" stop-color="#101819"/></linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18395a"/><stop offset="1" stop-color="#10283d"/></linearGradient>
    <linearGradient id="runtime" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173d31"/><stop offset="1" stop-color="#102b24"/></linearGradient>
    <linearGradient id="external" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4a321d"/><stop offset="1" stop-color="#2c2117"/></linearGradient>
    <linearGradient id="console" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3d2955"/><stop offset="1" stop-color="#281d38"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".34"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8adbb2"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e1a75f"/></marker>
    <style>
      .title{fill:#f1f7f5;font:700 34px Inter,Arial,"PingFang SC",sans-serif}.sub{fill:#8fa3a3;font:16px Inter,Arial,"PingFang SC",sans-serif}.laneTitle{fill:#ecf5f2;font:700 20px Inter,Arial,"PingFang SC",sans-serif}.laneSub{fill:#9aacab;font:13px Inter,Arial,"PingFang SC",sans-serif}.boxTitle{fill:#f2f7f5;font:700 16px Inter,Arial,"PingFang SC",sans-serif}.boxText{fill:#b3c2c0;font:13px Inter,Arial,"PingFang SC",sans-serif}.tiny{fill:#839796;font:12px Inter,Arial,"PingFang SC",sans-serif}.badge{fill:#0b1515;font:700 12px Inter,Arial,"PingFang SC",sans-serif}.flowLabel{fill:#83cfa9;font:700 12px Inter,Arial,"PingFang SC",sans-serif}.num{fill:#9cffca;font:700 15px Inter,Arial,sans-serif}.externalText{fill:#efc890;font:700 12px Inter,Arial,"PingFang SC",sans-serif}
    </style>
  </defs>

  <rect width="1800" height="1280" fill="url(#bg)"/>
  <circle cx="1610" cy="110" r="250" fill="#5ab98c" opacity=".05"/>
  <text x="70" y="72" class="title">Agent-directed Video Production Architecture</text>
  <text x="70" y="105" class="sub">Codex 决策 · Runtime 执行与记账 · Provider 生成 · Console 投影 · 2026-08-20</text>

  <!-- Ownership lanes -->
  <rect x="70" y="145" width="1660" height="150" rx="18" fill="url(#agent)" stroke="#3a74a3" opacity=".97" filter="url(#shadow)"/>
  <text x="95" y="180" class="laneTitle">01 · 主 Agent 与仓库 Skill（创作决策层）</text>
  <text x="95" y="204" class="laneSub">当前由 Codex GPT 承担；可替换 Host，但所有生产状态必须写回仓库契约</text>
  <rect x="95" y="224" width="260" height="50" rx="10" fill="#0e263b" stroke="#4c88b8"/><text x="113" y="247" class="boxTitle">Codex GPT</text><text x="113" y="266" class="boxText">理解需求、创意、看片、重试</text>
  <rect x="375" y="224" width="335" height="50" rx="10" fill="#0e263b" stroke="#4c88b8"/><text x="393" y="247" class="boxTitle">create-production-video</text><text x="393" y="266" class="boxText">人物、故事、分镜、连续性、路由</text>
  <rect x="730" y="224" width="300" height="50" rx="10" fill="#0e263b" stroke="#4c88b8"/><text x="748" y="247" class="boxTitle">H3 specialist Skill</text><text x="748" y="266" class="boxText">场景路由、Profile 与参数方法</text>
  <rect x="1050" y="224" width="300" height="50" rx="10" fill="#0e263b" stroke="#4c88b8"/><text x="1068" y="247" class="boxTitle">Review specialist Skill</text><text x="1068" y="266" class="boxText">宽松草稿门 / 严格终稿门</text>
  <rect x="1370" y="224" width="330" height="50" rx="10" fill="#0e263b" stroke="#4c88b8"/><text x="1388" y="247" class="boxTitle">LibTV CLI / Delivery Skills</text><text x="1388" y="266" class="boxText">外部工具的受控操作方法</text>

  <rect x="70" y="320" width="1660" height="150" rx="18" fill="url(#runtime)" stroke="#3b8067" opacity=".97" filter="url(#shadow)"/>
  <text x="95" y="355" class="laneTitle">02 · TypeScript / Node.js Runtime（执行与唯一事实层）</text>
  <text x="95" y="379" class="laneSub">校验、执行、恢复、资产、血缘、成本、评审和 Manifest；绝不自行发明故事或自动接受候选</text>
  <rect x="95" y="399" width="260" height="50" rx="10" fill="#0e2a22" stroke="#4d987b"/><text x="113" y="422" class="boxTitle">Production Project</text><text x="113" y="441" class="boxText">Brief / Bible / Assets / Config IDs</text>
  <rect x="375" y="399" width="335" height="50" rx="10" fill="#0e2a22" stroke="#4d987b"/><text x="393" y="422" class="boxTitle">StoryProductionPlan</text><text x="393" y="441" class="boxText">Story / Scene / Shot / Continuity</text>
  <rect x="730" y="399" width="300" height="50" rx="10" fill="#0e2a22" stroke="#4d987b"/><text x="748" y="422" class="boxTitle">ProductionOperation</text><text x="748" y="441" class="boxText">Command / Dependency / Task / Asset</text>
  <rect x="1050" y="399" width="300" height="50" rx="10" fill="#0e2a22" stroke="#4d987b"/><text x="1068" y="422" class="boxTitle">Explicit Review Gate</text><text x="1068" y="441" class="boxText">Execution ≠ Acceptance</text>
  <rect x="1370" y="399" width="330" height="50" rx="10" fill="#0e2a22" stroke="#4d987b"/><text x="1388" y="422" class="boxTitle">Asset / Cost / Delivery Ledger</text><text x="1388" y="441" class="boxText">SQLite now · production DB later</text>

  <rect x="70" y="495" width="1660" height="130" rx="18" fill="url(#console)" stroke="#74539b" opacity=".97" filter="url(#shadow)"/>
  <text x="95" y="530" class="laneTitle">03 · Production Console（端侧展示与人工接管层）</text>
  <text x="95" y="554" class="laneSub">React UI 读取 Runtime 投影；展示计划、镜头、操作、素材、评审、成本和交付，并跳转 ComfyUI / LibTV</text>
  <rect x="95" y="574" width="355" height="30" rx="8" fill="#251a35" stroke="#76539e"/><text x="112" y="595" class="boxText">不运行隐藏 Director · 不复制节点图 · 不自动推进门禁</text>
  <rect x="470" y="574" width="345" height="30" rx="8" fill="#251a35" stroke="#76539e"/><text x="487" y="595" class="boxText">Plan / Operation / Asset / Review 可视化</text>
  <rect x="835" y="574" width="345" height="30" rx="8" fill="#251a35" stroke="#76539e"/><text x="852" y="595" class="boxText">人工 accept / reject 必须写入 Runtime</text>
  <rect x="1200" y="574" width="500" height="30" rx="8" fill="#251a35" stroke="#76539e"/><text x="1217" y="595" class="boxText">3321 是控制终端，不是 ComfyUI 或 LibTV 无限画布替代品</text>

  <!-- Main production flow -->
  <text x="70" y="690" class="laneTitle">04 · 一次真实生产的阶段链路</text>
  <text x="70" y="716" class="laneSub">绿色箭头表示被 Runtime 持久化的前进；任何失败只回到责任镜头与责任阶段</text>

  <g filter="url(#shadow)">
    <rect x="70" y="755" width="180" height="130" rx="14" fill="#132328" stroke="#35515a"/>
    <text x="90" y="785" class="num">01</text><text x="90" y="813" class="boxTitle">Brief + References</text><text x="90" y="840" class="boxText">目标、人物图、场景</text><text x="90" y="861" class="boxText">预算、横屏 4K 规格</text>

    <rect x="275" y="755" width="190" height="130" rx="14" fill="url(#agent)" stroke="#4c88b8"/>
    <text x="295" y="785" class="num">02</text><text x="295" y="813" class="boxTitle">Codex Creative</text><text x="295" y="840" class="boxText">人物 / 故事 / 分镜</text><text x="295" y="861" class="boxText">连续性与验收标准</text>

    <rect x="490" y="755" width="190" height="130" rx="14" fill="url(#runtime)" stroke="#4d987b"/>
    <text x="510" y="785" class="num">03</text><text x="510" y="813" class="boxTitle">Persist Plan</text><text x="510" y="840" class="boxText">Schema + references</text><text x="510" y="861" class="boxText">durable Shot IDs</text>

    <rect x="705" y="755" width="190" height="130" rx="14" fill="url(#external)" stroke="#a86f35"/>
    <text x="725" y="785" class="num">04</text><text x="725" y="813" class="boxTitle">Control Draft</text><text x="725" y="840" class="boxText">ComfyUI + H3</text><text x="725" y="861" class="boxText">motion-reference</text>

    <rect x="920" y="755" width="190" height="130" rx="14" fill="url(#agent)" stroke="#4c88b8"/>
    <text x="940" y="785" class="num">05</text><text x="940" y="813" class="boxTitle">Relaxed Review</text><text x="940" y="840" class="boxText">动作 / 机位 / 节奏</text><text x="940" y="861" class="boxText">accept or revise-control</text>

    <rect x="1135" y="755" width="190" height="130" rx="14" fill="url(#external)" stroke="#a86f35"/>
    <text x="1155" y="785" class="num">06</text><text x="1155" y="813" class="boxTitle">Final Render</text><text x="1155" y="840" class="boxText">Seedance / MiniMax</text><text x="1155" y="861" class="boxText">or LibTV model</text>

    <rect x="1350" y="755" width="190" height="130" rx="14" fill="url(#agent)" stroke="#4c88b8"/>
    <text x="1370" y="785" class="num">07</text><text x="1370" y="813" class="boxTitle">Strict Review</text><text x="1370" y="840" class="boxText">身份 / 叙事 / 时序</text><text x="1370" y="861" class="boxText">accept or local retry</text>

    <rect x="1565" y="755" width="165" height="130" rx="14" fill="url(#runtime)" stroke="#4d987b"/>
    <text x="1585" y="785" class="num">08</text><text x="1585" y="813" class="boxTitle">Accepted Shot</text><text x="1585" y="840" class="boxText">immutable asset</text><text x="1585" y="861" class="boxText">complete lineage</text>
  </g>
  <path d="M250 820H270 M465 820H485 M680 820H700 M895 820H915 M1110 820H1130 M1325 820H1345 M1540 820H1560" stroke="#8adbb2" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Finalization -->
  <rect x="910" y="930" width="820" height="245" rx="18" fill="#111b1c" stroke="#38514f"/>
  <text x="940" y="968" class="laneTitle">生成模型结束后：确定性成片与交付</text>
  <rect x="940" y="995" width="220" height="110" rx="12" fill="url(#runtime)" stroke="#4d987b"/>
  <text x="960" y="1024" class="boxTitle">Accepted Shot Manifest</text><text x="960" y="1050" class="boxText">计划中的每个镜头</text><text x="960" y="1071" class="boxText">都必须有已接受终稿</text>
  <rect x="1190" y="995" width="220" height="110" rx="12" fill="url(#external)" stroke="#a86f35"/>
  <text x="1210" y="1024" class="boxTitle">HyperFrames</text><text x="1210" y="1050" class="boxText">裁切 / 字幕 / 转场</text><text x="1210" y="1071" class="boxText">品牌图形 / 音频包装</text>
  <rect x="1440" y="995" width="260" height="110" rx="12" fill="url(#external)" stroke="#a86f35"/>
  <text x="1460" y="1024" class="boxTitle">Delivery / IMS / QC</text><text x="1460" y="1050" class="boxText">母版 / 4K / 编码 / 音轨</text><text x="1460" y="1071" class="boxText">Manifest / 签发 / 归档</text>
  <path d="M1160 1050H1185 M1410 1050H1435" stroke="#e1a75f" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <text x="940" y="1142" class="tiny">禁止默认把已剪好的多场景母版再次送入生成模型重绘；这会破坏人物、字幕、剪点和音画同步。</text>

  <!-- Legend / migration -->
  <rect x="70" y="930" width="800" height="245" rx="18" fill="#11191a" stroke="#314143"/>
  <text x="100" y="968" class="laneTitle">所有权与迁移说明</text>
  <rect x="100" y="995" width="92" height="24" rx="12" fill="#4c88b8"/><text x="119" y="1012" class="badge">AGENT</text><text x="210" y="1012" class="boxText">创作、路由、评审、重试与接受决定</text>
  <rect x="100" y="1033" width="92" height="24" rx="12" fill="#4d987b"/><text x="113" y="1050" class="badge">RUNTIME</text><text x="210" y="1050" class="boxText">校验、执行、恢复、事实、门禁和审计</text>
  <rect x="100" y="1071" width="92" height="24" rx="12" fill="#a86f35"/><text x="111" y="1088" class="badge">EXTERNAL</text><text x="210" y="1088" class="boxText">ComfyUI、模型、LibTV、HyperFrames、IMS</text>
  <rect x="100" y="1109" width="92" height="24" rx="12" fill="#76539e"/><text x="111" y="1126" class="badge">CONSOLE</text><text x="210" y="1126" class="boxText">只读投影与显式人工命令</text>
  <text x="100" y="1158" class="tiny">旧 PiDirector / WorkflowEngine / FirstSuccessfulCandidateEvaluator 仅保留给 Legacy VideoJob 回归，</text>
  <text x="100" y="1177" class="tiny">不再进入新的 Agent-directed 主生产链。</text>

  <text x="70" y="1242" class="sub">Repository source of truth: Skills + ProductionProject + StoryProductionPlan + ProductionOperation + ProjectAsset + explicit Review</text>
</svg>
